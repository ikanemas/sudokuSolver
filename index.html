<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Solver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <div class="container">
        <h1>Sudoku Solver</h1>
        <p>Enter your Sudoku puzzle below and click "Solve" to find the solution.</p>
        <div id ="sudoku-grid"></div>
        <div class="button">
            <button type="button" onclick="solveSudoku()">Solve</button>
            <button type="button" onclick="clearBoard()">Clear</button>
            <button type="button" onclick="example()">Example</button>
            <button type="button" onclick="hint()">Hint</button>
            <button type="button" onclick="generateSudoku()">Generate Puzzle</button>
        </div>
        <p id="message"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
